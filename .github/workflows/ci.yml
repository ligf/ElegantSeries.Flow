name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build + Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build ElegantSeries.Flow.slnx -c Release --nologo

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: dotnet test ElegantSeries.Flow.slnx -c Release --no-build -f net10.0

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: dotnet test ElegantSeries.Flow.slnx -c Release --no-build        
  aot-publish:
    name: AOT publish smoke test (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    steps:
      - uses: actions/checkout@v7
  
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
  
      - name: Publish Avalonia sample (Native AOT)
        run: dotnet publish samples/ElegantSeries.Flow.Samples.Avalonia -c Release -r ${{ matrix.rid }} --self-contained
