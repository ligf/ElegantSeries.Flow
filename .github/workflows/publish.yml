name: publish
on:
  push:
    tags: ['[0-9]*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '10.0.x' }

      - name: Build
        run: dotnet build ElegantSeries.Flow.slnx -c Release --nologo
      - name: Test
        run: dotnet test ElegantSeries.Flow.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack ElegantSeries.Flow.slnx -c Release --no-build -o ./artifacts

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ligf

      - name: Push to nuget.org
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
